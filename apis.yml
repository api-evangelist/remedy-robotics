description: Remedy Robotics is a medical robotics company developing what it describes
  as the world's first endovascular robot capable of performing entire cardiovascular
  and stroke procedures under onsite, remote, or autonomous control. Its stated mission
  is to expand timely access to life-saving vascular interventions for patients who
  cannot reach specialized stroke and cardiac care in time. Remedy Robotics is a
  portfolio company of DCVC. As a clinical-stage medical device developer, the company
  does not currently publish a public developer API, SDK, or developer portal.
